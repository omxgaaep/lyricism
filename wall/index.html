<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Album Wall</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, gallery-like ambience. IDEA: a record-shop wall of sleeves, lit from within.
   PICTURE: an edge-to-edge mosaic of covers that slowly flips. COLOUR: the covers themselves on black. TYPE: SF/Inter, small and quiet. */
:root{--tile:170px;--spring:linear(0,.009,.037 1.7%,.153 3.6%,.776 10.3%,1.001,1.142 16%,1.185,1.209 19%,1.215 19.9% 20.8%,1.199,1.165 25%,1.056 30.3%,1.008 33%,.973,.958 39.4%,.954 41.7%,.96,.977 47.8%,1.006 54.1%,1.015 58.2%,1.006 66.6%,.997 74.5%,1);
 --soft:linear(0,.06,.21 7%,.44 12.5%,.7 19%,.87 25.5%,.96 32%,1.01 39%,1.02 46%,1.008 60%,1)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#000;color:#fff;font:15px/1.4 -apple-system,'SF Pro Text',Inter,system-ui,sans-serif;overflow:hidden}
.wall{position:fixed;inset:-4%;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:3px;perspective:1200px;animation:drift 60s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes drift{0%{transform:scale(1.04) translate(-1%,-1%)}100%{transform:scale(1.1) translate(1.5%,1%)}}
.t{position:relative;aspect-ratio:1;transform-style:preserve-3d;transition:transform .9s var(--soft);cursor:pointer}
.t.flip{transform:rotateY(180deg)}
.f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#111 center/cover;border-radius:2px;transition:filter .4s,box-shadow .4s}
.f.b{transform:rotateY(180deg)}
.t:hover{z-index:3}
.t:hover .f{filter:brightness(1.1)}
.t .lift{position:absolute;inset:0;transition:transform .5s var(--spring),box-shadow .4s;transform-style:preserve-3d}
.t:hover .lift{transform:translateZ(40px) scale(1.06);box-shadow:0 24px 60px rgba(0,0,0,.7)}
.t.np .lift::after{content:"";position:absolute;inset:-3px;border-radius:4px;border:3px solid #fff;box-shadow:0 0 30px rgba(255,255,255,.7);animation:pulse 2s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{box-shadow:0 0 10px rgba(255,255,255,.3);opacity:.7}}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));z-index:2}
.dim .wall{filter:brightness(.55) saturate(.9);transition:filter .6s}
.wall{transition:filter .6s}

/* top bar (appears on mouse move) */
.bar{position:fixed;left:50%;top:16px;z-index:6;display:flex;align-items:center;gap:6px;padding:6px;border-radius:20px;background:rgba(30,30,34,.55);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
 border:.5px solid rgba(255,255,255,.16);box-shadow:0 20px 50px rgba(0,0,0,.5);transform:translate(-50%,-90px);opacity:0;transition:transform .6s var(--spring),opacity .3s;width:max-content;max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center}
body.ui .bar{transform:translate(-50%,0);opacity:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:14px;border:0;background:transparent;color:#fff;font:600 13px inherit;cursor:pointer;text-decoration:none;transition:background .2s,transform .45s var(--spring)}
.pill:hover{background:rgba(255,255,255,.12)}.pill:active{transform:scale(.92)}
.seg{display:inline-flex;background:rgba(118,118,128,.24);border-radius:11px;padding:2px}
.seg button{border:0;background:none;color:#fff;font:600 12px inherit;padding:7px 11px;border-radius:9px;cursor:pointer;transition:background .25s,color .25s}
.seg button.on{background:#fff;color:#000}
.sz{width:90px;accent-color:#fff}
.sep{width:.5px;height:22px;background:rgba(255,255,255,.2);margin:0 2px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* caption on hover */
.cap{position:fixed;z-index:5;pointer-events:none;padding:10px 14px;border-radius:14px;background:rgba(20,20,24,.7);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.15);
 opacity:0;transform:translateY(6px) scale(.96);transition:opacity .2s,transform .35s var(--soft);max-width:260px}
.cap.on{opacity:1;transform:none}
.cap b{display:block;font-size:14px;line-height:1.25}.cap small{opacity:.7;font-size:12px}

/* detail sheet */
.scrim{position:fixed;inset:0;z-index:7;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;top:50%;z-index:8;width:min(380px,calc(100vw - 32px));padding:18px;border-radius:28px;text-align:center;
 background:rgba(30,30,34,.7);backdrop-filter:blur(30px) saturate(180%);border:.5px solid rgba(255,255,255,.16);box-shadow:0 30px 90px rgba(0,0,0,.7);
 opacity:0;visibility:hidden;transform:translate(-50%,-46%) scale(.9);filter:blur(6px);transition:opacity .2s,filter .25s,transform .45s var(--soft),visibility 0s .45s}
.sheet.on{opacity:1;visibility:visible;filter:none;transform:translate(-50%,-50%);transition:opacity .22s,filter .3s,transform .65s var(--spring),visibility 0s}
.sheet .cv{width:100%;aspect-ratio:1;border-radius:16px;background:#222 center/cover;box-shadow:0 20px 50px rgba(0,0,0,.5);margin-bottom:14px}
.sheet h3{margin:0;font-size:20px;letter-spacing:-.01em}.sheet p{margin:4px 0 0;opacity:.7}
.sheet .tr{margin:10px 0 0;font-size:12.5px;opacity:.6}
.acts{display:flex;gap:8px;margin-top:16px}
.acts a,.acts button{flex:1;height:44px;border:0;border-radius:22px;font:700 14px inherit;cursor:pointer;display:grid;place-items:center;text-decoration:none;transition:transform .45s var(--spring)}
.acts a{background:#1ed760;color:#000}.acts button{background:rgba(255,255,255,.14);color:#fff}
.acts>*:active{transform:scale(.95)}

/* empty / login */
.msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:4;background:radial-gradient(circle at 30% 30%,#ff2bd633,transparent 50%),radial-gradient(circle at 70% 70%,#1ed76033,transparent 50%),#000}
.msg .c{max-width:420px;animation:rise .8s var(--soft) both}
.msg h1{font-size:clamp(40px,10vw,64px);line-height:.95;letter-spacing:-.04em;margin:0 0 12px;font-weight:800}
.msg p{opacity:.7;margin:0 0 22px;font-size:17px}
.msg .go{display:inline-grid;place-items:center;height:52px;padding:0 26px;border-radius:26px;background:#fff;color:#000;font-weight:700;text-decoration:none;border:0;font-size:16px;cursor:pointer;transition:transform .45s var(--spring)}
.msg .go:active{transform:scale(.95)}
.msg .back{display:block;margin-top:16px;color:#fff;opacity:.6;font-size:14px}
.load{display:flex;gap:12px;align-items:center;font-weight:600;opacity:.8}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}}
.t{animation:tin .9s var(--soft) both}
@keyframes tin{from{opacity:0;transform:scale(.85)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wall" id="wall"></div>
<div class="vig"></div>
<nav class="bar" id="bar">
 <a class="pill" href="../hub/"><svg width="9" height="15" viewBox="0 0 9 15"><path d="M7.5 1.5 1.5 7.5l6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Home</a>
 <span class="sep"></span>
 <div class="seg" id="rg"><button data-r="short_term">4 weeks</button><button data-r="medium_term">6 months</button><button data-r="long_term">All time</button></div>
 <span class="sep"></span>
 <label class="pill" title="Tile size"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="5" height="5" rx="1" fill="currentColor"/><rect x="8" y="1" width="5" height="5" rx="1" fill="currentColor"/><rect x="1" y="8" width="5" height="5" rx="1" fill="currentColor"/><rect x="8" y="8" width="5" height="5" rx="1" fill="currentColor"/></svg><input class="sz" id="sz" type="range" min="100" max="300" step="10" aria-label="Tile size"></label>
 <button class="pill" id="shuf">Shuffle</button>
 <button class="pill" id="fs">Fullscreen</button>
</nav>
<div class="cap" id="cap"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="msg"></div>
<script>
{
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Spotify (shared login with Lyricism) ---------- */
async function token(){
 if(+store.get('ll_exp')>Date.now()&&store.get('ll_token'))return store.get('ll_token');
 const rt=store.get('ll_refresh'),cid=store.get('ll_cid');if(!rt||!cid)return null;
 try{const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:rt,client_id:cid})});
  const j=await r.json();if(!r.ok)return null;store.set('ll_token',j.access_token);store.set('ll_exp',Date.now()+j.expires_in*1000-60000);if(j.refresh_token)store.set('ll_refresh',j.refresh_token);return j.access_token}catch(e){return null}
}
async function sp(path){const t=await token();if(!t)throw new Error('auth');const r=await fetch('https://api.spotify.com/v1'+path,{headers:{Authorization:'Bearer '+t}});if(r.status===204)return null;if(!r.ok)throw new Error(String(r.status));return r.json()}
const img=o=>(o?.images||[]).slice().sort((a,b)=>(b.width||0)-(a.width||0))[0]?.url||'';

/* ---------- state ---------- */
let range=store.get('wl_range')||'medium_term',size=+store.get('wl_size')||170,albums=[],tiles=[],npId=null,flipT=null;

async function getAlbums(r){
 const m=new Map(),add=(t,rank)=>{const a=t?.album;if(!a||!a.id||!img(a))return;const o=m.get(a.id)||{id:a.id,name:a.name,artist:(t.artists||[]).map(x=>x.name).join(', '),art:img(a),url:a.external_urls?.spotify||'',year:(a.release_date||'').slice(0,4),tracks:[],score:0};
  o.score+=100-rank;if(o.tracks.length<3&&!o.tracks.includes(t.name))o.tracks.push(t.name);m.set(a.id,o)};
 const pages=await Promise.all([0,49].map(off=>sp(`/me/top/tracks?limit=50&offset=${off}&time_range=${r}`).catch(()=>null)));
 pages.forEach((p,pi)=>(p?.items||[]).forEach((t,i)=>add(t,pi*50+i)));
 if(m.size<24){try{(await sp('/me/player/recently-played?limit=50'))?.items?.forEach((p,i)=>add(p.track,100+i))}catch(e){}}
 return [...m.values()].sort((a,b)=>b.score-a.score);
}

/* ---------- layout ---------- */
function layout(){
 const W=innerWidth*1.08,H=innerHeight*1.08,cols=Math.max(3,Math.round(W/size)),rows=Math.ceil(H/(W/cols))+1,n=cols*rows;
 document.documentElement.style.setProperty('--cols',cols);
 if(!albums.length)return;
 // fill the wall, spreading repeats out so the same cover rarely sits next to itself
 let order=[];while(order.length<n)order=order.concat(shuffle(albums));
 order=order.slice(0,n);
 for(let i=0;i<n;i++){const L=i%cols?order[i-1]:null,U=i>=cols?order[i-cols]:null;if((L&&L.id===order[i].id)||(U&&U.id===order[i].id)){const k=order.findIndex((x,j)=>j>i&&x.id!==order[i].id&&x.id!==(L&&L.id)&&x.id!==(U&&U.id));if(k>0)[order[i],order[k]]=[order[k],order[i]]}}
 tiles=order.map(a=>({a,side:0}));
 $('wall').innerHTML=tiles.map((t,i)=>`<div class="t" data-i="${i}" style="animation-delay:${Math.min(1200,((i%cols)+Math.floor(i/cols))*45)}ms"><div class="lift"><div class="f" style="background-image:url('${esc(t.a.art)}')"></div><div class="f b"></div></div></div>`).join('');
 markNP();
}
function flipOne(){
 if(document.hidden||!tiles.length||albums.length<2)return;
 const vis=new Set(tiles.map(t=>t.a.id));
 const i=Math.random()*tiles.length|0,el=$('wall').children[i];if(!el||el.matches(':hover'))return;
 const pool=albums.filter(a=>!vis.has(a.id)),pick=(pool.length?pool:albums.filter(a=>a.id!==tiles[i].a.id))[Math.random()*(pool.length||albums.length-1)|0];if(!pick)return;
 const faces=el.querySelectorAll('.f'),next=tiles[i].side?faces[0]:faces[1];
 const im=new Image();im.onload=()=>{next.style.backgroundImage=`url('${pick.art}')`;tiles[i].side^=1;tiles[i].a=pick;el.classList.toggle('flip',!!tiles[i].side);markNP()};im.src=pick.art;
}
function startFlips(){clearInterval(flipT);if(!reduce)flipT=setInterval(flipOne,2200)}

/* ---------- now playing highlight ---------- */
async function pollNP(){
 try{const d=await sp('/me/player/currently-playing');const a=d?.item?.album;const id=d?.is_playing&&a?a.id:null;
  if(id&&id!==npId&&!tiles.some(t=>t.a.id===id)&&tiles.length){const alb={id,name:a.name,artist:(d.item.artists||[]).map(x=>x.name).join(', '),art:img(a),url:a.external_urls?.spotify||'',year:(a.release_date||'').slice(0,4),tracks:[d.item.name]};
   if(!albums.some(x=>x.id===id))albums.push(alb);
   const cols=+getComputedStyle(document.documentElement).getPropertyValue('--cols'),rows=Math.ceil(tiles.length/cols),mid=Math.floor(rows/2)*cols+Math.floor(cols/2),el=$('wall').children[mid];
   if(el){const faces=el.querySelectorAll('.f'),next=tiles[mid].side?faces[0]:faces[1];next.style.backgroundImage=`url('${alb.art}')`;tiles[mid].side^=1;tiles[mid].a=alb;el.classList.toggle('flip',!!tiles[mid].side)}}
  npId=id;markNP();
 }catch(e){}
}
function markNP(){[...$('wall').children].forEach((el,i)=>el.classList.toggle('np',!!npId&&tiles[i]?.a.id===npId))}

/* ---------- interactions ---------- */
const cap=$('cap');
$('wall').addEventListener('mousemove',e=>{const el=e.target.closest('.t');if(!el){cap.classList.remove('on');return}const t=tiles[+el.dataset.i];if(!t)return;
 cap.innerHTML=`<b>${esc(t.a.name)}</b><small>${esc(t.a.artist)}${t.a.id===npId?' · Now playing':''}</small>`;cap.classList.add('on');
 const x=Math.min(innerWidth-cap.offsetWidth-12,e.clientX+16),y=Math.min(innerHeight-cap.offsetHeight-12,e.clientY+16);cap.style.left=x+'px';cap.style.top=y+'px'});
$('wall').addEventListener('mouseleave',()=>cap.classList.remove('on'));
$('wall').addEventListener('click',e=>{const el=e.target.closest('.t');if(!el)return;const a=tiles[+el.dataset.i]?.a;if(!a)return;cap.classList.remove('on');
 $('sheet').innerHTML=`<div class="cv" style="background-image:url('${esc(a.art)}')"></div><h3>${esc(a.name)}</h3><p>${esc(a.artist)}${a.year?' · '+esc(a.year):''}</p>${a.tracks?.length?`<p class="tr">Your favourites: ${a.tracks.map(esc).join(', ')}</p>`:''}
  <div class="acts">${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Open in Spotify</a>`:''}<button id="cl">Close</button></div>`;
 $('sheet').classList.add('on');$('scrim').classList.add('on');document.body.classList.add('dim');$('cl').onclick=closeSheet});
function closeSheet(){$('sheet').classList.remove('on');$('scrim').classList.remove('on');document.body.classList.remove('dim')}
$('scrim').onclick=closeSheet;addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='f'||e.key==='F')fs()});
let uiT;const ui=()=>{document.body.classList.add('ui');clearTimeout(uiT);uiT=setTimeout(()=>{if(!$('bar').matches(':hover'))document.body.classList.remove('ui')},2600)};
addEventListener('mousemove',e=>{if(e.clientY<120)ui()});addEventListener('touchstart',ui,{passive:true});
const fs=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('fs').onclick=fs;
$('shuf').onclick=()=>{albums=shuffle(albums);layout()};
$('sz').value=size;$('sz').oninput=e=>{size=+e.target.value;store.set('wl_size',size);clearTimeout(window._lt);window._lt=setTimeout(layout,120)};
const markRange=()=>$('rg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.r===range));
$('rg').querySelectorAll('button').forEach(b=>b.onclick=async()=>{range=b.dataset.r;store.set('wl_range',range);markRange();await load()});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,200)});

/* ---------- boot ---------- */
function message(html){$('msg').innerHTML=`<div class="msg"><div class="c">${html}</div></div>`}
async function load(){
 message('<div class="load"><div class="spin"></div>Hanging your albums…</div>');
 try{albums=await getAlbums(range)}catch(e){
  if(e.message==='auth'){message(`<h1>Album Wall</h1><p>Your Spotify login has expired. Reconnect in Lyricism.</p><a class="go" href="../">Open Lyricism</a><a class="back" href="../hub/">‹ Home</a>`);return}
  message(`<h1>Hmm.</h1><p>Couldn't load your albums right now.</p><button class="go" id="rt">Try again</button><a class="back" href="../hub/">‹ Home</a>`);$('rt').onclick=load;return}
 if(albums.length<4){message(`<h1>Not enough yet.</h1><p>Spotify doesn't have enough listening for this range. Try a longer one.</p><button class="go" id="lg">Show all time</button><a class="back" href="../hub/">‹ Home</a>`);$('lg').onclick=()=>{range='long_term';store.set('wl_range',range);markRange();load()};return}
 $('msg').innerHTML='';layout();startFlips();ui();
}
markRange();
if(!store.get('ll_refresh'))message(`<h1>Album Wall</h1><p>A living wall of the albums you play most. Connect Spotify in Lyricism first.</p><a class="go" href="../">Connect Spotify</a><a class="back" href="../hub/">‹ Home</a>`);
else if(!/\buser-top-read\b/.test(store.get('ll_scope')||''))message(`<h1>Album Wall</h1><p>One quick Spotify approval so the wall can see your top albums.</p><a class="go" href="../?login=wall">Allow access</a><a class="back" href="../hub/">‹ Home</a>`);
else{load();pollNP();setInterval(pollNP,15000)}
}
</script>
</body>
</html>
