<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home</title>
<meta name="theme-color" content="#060608">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<script>/* light/dark: Auto follows local sunrise and sunset (saved by the weather widget below) */
(function(){try{var p=localStorage.getItem('ui_theme')||'auto',d;
 if(p==='auto'){var s=JSON.parse(localStorage.getItem('ui_sun')||'null'),t=new Date(),m=t.getHours()*60+t.getMinutes();
  if(s&&s.rise!=null&&s.set!=null&&Date.now()-s.at<3*864e5)d=!(m>=s.rise&&m<s.set);else d=t.getHours()<6||t.getHours()>=18}
 else d=p==='dark';document.documentElement.dataset.theme=d?'dark':'light'}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: personal home screen, calm and premium. IDEA: an iPhone home screen of live widgets.
   PICTURE: the bento of widgets itself, each a window into one app. COLOUR: black glass, tinted by what's playing. TYPE: SF/Inter. */
:root{--a:#ff2bd6;--b:#3b5bff;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--dim:rgba(255,255,255,.6);
 --spring:linear(0,.009,.037 1.7%,.153 3.6%,.776 10.3%,1.001,1.142 16%,1.185,1.209 19%,1.215 19.9% 20.8%,1.199,1.165 25%,1.056 30.3%,1.008 33%,.973,.958 39.4%,.954 41.7%,.96,.977 47.8%,1.006 54.1%,1.015 58.2%,1.006 66.6%,.997 74.5%,1);
 --soft:linear(0,.06,.21 7%,.44 12.5%,.7 19%,.87 25.5%,.96 32%,1.01 39%,1.02 46%,1.008 60%,1)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{background:#060608}
body{margin:0;color:#fff;font:15px/1.4 -apple-system,'SF Pro Text',Inter,system-ui,sans-serif;min-height:100vh;overflow-x:clip;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#060608}
.bg i{position:absolute;width:65vmax;height:65vmax;border-radius:50%;filter:blur(110px);opacity:.42;transition:background 1.5s}
.bg i:nth-child(1){background:var(--a);left:-22vmax;top:-28vmax;animation:d1 28s ease-in-out infinite alternate}
.bg i:nth-child(2){background:var(--b);right:-24vmax;bottom:-30vmax;animation:d2 32s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(14vw,12vh) scale(1.1)}}@keyframes d2{to{transform:translate(-12vw,-10vh) scale(.9)}}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(22px,5vh,56px) max(4vw,16px) 50px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:clamp(18px,3vh,30px)}
.hello small{display:block;color:var(--dim);font-weight:600;font-size:14px;margin-bottom:4px;animation:rise .7s var(--soft) both}
.hello h1{margin:0;font-size:clamp(34px,6vw,54px);line-height:1;letter-spacing:-.04em;font-weight:800;animation:rise .7s .06s var(--soft) both}
.me{display:flex;align-items:center;gap:10px;animation:rise .7s .1s var(--soft) both}
.me .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b)) center/cover;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.cbtn{height:40px;padding:0 16px;border-radius:20px;border:0;background:#1ed760;color:#000;font:700 14px inherit;cursor:pointer;text-decoration:none;display:inline-grid;place-items:center;transition:transform .45s var(--spring)}
.cbtn:active{transform:scale(.94)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(150px,19vw,200px);gap:clamp(12px,1.8vw,18px);
 grid-template-areas:"lyr lyr mat mat" "lyr lyr wrp wal" "wea con con con"}
.w{position:relative;border-radius:28px;overflow:hidden;color:#fff;text-decoration:none;background:var(--glass);border:.5px solid var(--line);
 backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 .5px 0 rgba(255,255,255,.14);
 display:flex;flex-direction:column;padding:18px;animation:wrise .8s var(--soft) both;transition:transform .55s var(--spring),box-shadow .3s}
.w:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.18)}
.w:active{transform:scale(.97);transition-duration:.2s}
.w:focus-visible{outline:2px solid #fff;outline-offset:3px}
@keyframes wrise{from{opacity:0;transform:translateY(24px) scale(.94);filter:blur(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(6px)}}
.lyr{grid-area:lyr;animation-delay:.08s}.mat{grid-area:mat;animation-delay:.14s}.wrp{grid-area:wrp;animation-delay:.2s}.wal{grid-area:wal;animation-delay:.26s}.con{grid-area:con;animation-delay:.38s}.wea{grid-area:wea;animation-delay:.32s}
.lab{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--dim);position:relative;z-index:2}
.lab i{width:18px;height:18px;border-radius:6px;display:grid;place-items:center}
.body{position:relative;z-index:2;margin-top:auto}
.wbg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;transition:opacity .8s}
.wshade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.65))}
/* Lyricism widget */
.lyr .wbg{filter:blur(46px) saturate(1.7) brightness(.78);transform:scale(1.5);animation:lyrdrift 26s ease-in-out infinite alternate}
@keyframes lyrdrift{to{transform:scale(1.7) translate(4%,-3%) rotate(6deg)}}
.lyr .wshade{background:radial-gradient(120% 80% at 30% 0%,rgba(0,0,0,0),rgba(0,0,0,.35) 70%),linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.45))}
.lyr .body{display:flex;flex-direction:column;flex:1;margin-top:14px;min-height:0}
.nphead{display:flex;align-items:center;gap:14px}
.nphead .cv{width:clamp(62px,7vw,84px);aspect-ratio:1;flex:none;border-radius:12px;background-color:#222;background-size:cover!important;background-position:center;box-shadow:0 12px 28px rgba(0,0,0,.45);transition:transform .7s var(--spring)}
.paused .nphead .cv{transform:scale(.9)}
.nphead b{display:block;font-size:clamp(16px,1.7vw,20px);font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nphead small{display:block;color:rgba(255,255,255,.72);font-size:14px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nphead>div{flex:1;min-width:0}
.lyrs{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:10px 0;min-height:0;overflow:hidden}
.lcur{font-size:clamp(22px,2.9vw,34px);font-weight:800;line-height:1.14;letter-spacing:-.02em;text-wrap:balance;color:#fff;
 display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lnxt{font-size:clamp(14px,1.5vw,17px);font-weight:700;color:rgba(255,255,255,.45);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcur.in,.lnxt.in{animation:lin .55s var(--soft) both}.lnxt.in{animation-delay:.06s}
@keyframes lin{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}
.lcur .lw{--p:0;opacity:calc(.4 + .6*var(--p));transition:opacity .15s}
.lcur.none{color:rgba(255,255,255,.55);font-size:clamp(17px,2vw,22px)}
.ptime{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
.ptime .pb{flex:1;margin:0}
.pb{height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}.pb i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.npc{display:flex;align-items:center;justify-content:center;gap:clamp(18px,3vw,34px);margin-top:10px}
.npc button{border:0;background:none;color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .45s var(--spring),background .2s}
.npc button:hover{background:rgba(255,255,255,.14)}.npc button:active{transform:scale(.86)}
.npc button svg{width:24px;height:24px}.npc button.pp{width:52px;height:52px;background:rgba(255,255,255,.95);color:#000}.npc button.pp svg{width:24px;height:24px}
.npc button.pp:hover{background:#fff}
.npc button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-left:auto}.eq s{width:3px;background:#1ed760;border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq s:nth-child(2){animation-delay:.2s}.eq s:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.paused .eq s{animation-play-state:paused}
.idle b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}.idle small{color:var(--dim)}
/* Matchday widget */
.mat{background:linear-gradient(120deg,rgba(0,77,152,.55),rgba(165,0,68,.45));}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;text-align:center}
.mrow img,.mrow .ph{width:clamp(40px,5vw,58px);height:clamp(40px,5vw,58px);object-fit:contain;margin:0 auto 6px;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.mrow .ph{border-radius:50%;background:rgba(255,255,255,.15)}
.mrow span{font-size:12.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{font:700 clamp(38px,5vw,56px)/1 'Barlow Condensed',Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sc em{font-style:normal;opacity:.4}
.mst{text-align:center;font-size:12px;font-weight:700;margin-top:6px;color:rgba(255,255,255,.85)}
.live{display:inline-flex;align-items:center;gap:5px;background:#ff375f;color:#fff;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:800}
.live s{width:6px;height:6px;border-radius:50%;background:#fff;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.25}}
/* Wrapped widget */
.wrp .wbg{filter:saturate(1.2)}
.wrp .body b{display:block;font-size:20px;font-weight:900;line-height:1.05;letter-spacing:-.02em}
.wrp .body small{color:rgba(255,255,255,.8);font-size:12px;font-weight:600}
/* Wall widget */
.mos{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;z-index:0;perspective:600px}
.mos div{background:#222 center/cover;transition:transform .9s var(--soft)}
.mos div.flip{transform:rotateY(180deg) scaleX(-1)}
.wal .wshade{background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 35%,rgba(0,0,0,.55))}
.wal .body b{font-size:16px;font-weight:800}
/* Concerts widget */
.con{background:linear-gradient(120deg,rgba(255,55,95,.28),rgba(255,159,10,.16));grid-auto-rows:auto}
.gigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:auto;position:relative;z-index:2}
.gig{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;padding:10px;border-radius:18px;background:rgba(0,0,0,.25)}
.gig .d{text-align:center;border-radius:12px;background:rgba(255,255,255,.08);padding:5px 0}
.gig .d small{display:block;font-size:10px;font-weight:800;color:#ff6b88;text-transform:uppercase}
.gig .d b{display:block;font-size:20px;font-weight:900;line-height:1}
.gig strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gig span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.con .idle{margin-top:auto;position:relative;z-index:2}
.foot{margin-top:26px;text-align:center;font-size:11.5px;color:rgba(255,255,255,.35)}

/* theme switch */
.tsw{display:inline-flex;background:var(--glass);border:.5px solid var(--line);border-radius:12px;padding:2px;backdrop-filter:blur(20px)}
.tsw button{width:34px;height:30px;border:0;background:none;color:inherit;border-radius:10px;display:grid;place-items:center;cursor:pointer;transition:background .25s,transform .45s var(--spring)}
.tsw button.on{background:rgba(255,255,255,.18)}.tsw button:active{transform:scale(.9)}
.tsw button:focus-visible{outline:2px solid currentColor}

/* weather widget */
.wea{cursor:default;padding:15px 16px 13px;--w1:#3f7fd6;--w2:#86c3f2;background:linear-gradient(165deg,var(--w1),var(--w2));color:#fff;border-color:rgba(255,255,255,.18);transition:background 1.2s,transform .55s var(--spring),box-shadow .3s}
.wea .lab{color:rgba(255,255,255,.85)}
.wloc{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-left:auto;white-space:nowrap}
.wbtn{border:0;background:rgba(255,255,255,.2);color:#fff;font:700 11px inherit;border-radius:999px;width:22px;height:22px;padding:0;justify-content:center;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:transform .45s var(--spring),background .2s}
.wbtn:hover{background:rgba(255,255,255,.3)}.wbtn:active{transform:scale(.92)}
.wnow{display:flex;align-items:center;gap:10px;margin-top:4px;position:relative;z-index:2}
.wnow .tmp{font-size:clamp(34px,4vw,46px);font-weight:300;line-height:1;letter-spacing:-.04em}
.wnow svg{width:clamp(38px,4.2vw,48px);height:clamp(38px,4.2vw,48px);flex:none;margin-left:auto}
.wdesc{font-size:13px;font-weight:600;position:relative;z-index:2}
.wdesc small{display:block;font-weight:600;opacity:.8}
.whrs{display:flex;justify-content:space-between;gap:4px;margin-top:auto;padding-top:4px;position:relative;z-index:2}
.whrs div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600}
.whrs svg{width:18px;height:18px}
.whrs b{font-size:13px}
.wfx{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.wfx i{position:absolute;top:-10%;width:1.5px;height:14px;border-radius:1px;background:rgba(255,255,255,.55);animation:rain 0.9s linear infinite}
.wfx i.s{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.85);animation:snow 4s linear infinite}
.wfx i.st{width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes rain{to{transform:translate(-14px,240px)}}@keyframes snow{to{transform:translate(20px,240px)}}@keyframes tw{50%{opacity:.2}}
.sunr{transform-origin:12px 12px;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.cld{animation:cd 6s ease-in-out infinite alternate}@keyframes cd{to{transform:translateX(2px)}}
.bolt{animation:bolt 3s steps(1) infinite}@keyframes bolt{0%,88%,100%{opacity:0}90%,94%{opacity:1}}

/* light theme */
:root[data-theme=light]{--glass:rgba(255,255,255,.6);--line:rgba(0,0,0,.07);--dim:rgba(0,0,0,.55)}
:root[data-theme=light],[data-theme=light] body,[data-theme=light] .bg{background:#eef0f5}
[data-theme=light] body{color:#111}
[data-theme=light] .bg i{opacity:.28}
[data-theme=light] .w{box-shadow:0 14px 40px rgba(20,30,60,.12),inset 0 .5px 0 rgba(255,255,255,.9)}
[data-theme=light] .w:hover{box-shadow:0 24px 60px rgba(20,30,60,.18),inset 0 .5px 0 rgba(255,255,255,.9)}
[data-theme=light] .lyr,[data-theme=light] .wrp,[data-theme=light] .wal,[data-theme=light] .mat{color:#fff}
[data-theme=light] .lyr{background:#1b1b20}[data-theme=light] .mat{background:linear-gradient(120deg,#0a4f9a,#9b0d47)}[data-theme=light] .wrp,[data-theme=light] .wal{background:#2a2a30}
[data-theme=light] .lyr .lab,[data-theme=light] .wrp .lab,[data-theme=light] .wal .lab,[data-theme=light] .mat .lab{color:rgba(255,255,255,.75)}
[data-theme=light] .lyr .idle small{color:rgba(255,255,255,.7)}
[data-theme=light] .con{color:#111;background:linear-gradient(120deg,rgba(255,55,95,.16),rgba(255,159,10,.12)),rgba(255,255,255,.6)}
[data-theme=light] .gig{background:rgba(255,255,255,.7)}[data-theme=light] .gig .d{background:rgba(0,0,0,.05)}
[data-theme=light] .tsw button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
[data-theme=light] .foot{color:rgba(0,0,0,.35)}
@media(max-width:720px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(160px,auto);grid-template-areas:"lyr lyr" "lyr lyr" "mat mat" "wrp wal" "wea wea" "con con"}
 .gigs{grid-template-columns:minmax(0,1fr)}.gig:nth-child(n+3){display:none}
 .top{flex-direction:column;align-items:flex-start}
 .me{width:100%;justify-content:space-between}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<div class="wrap">
 <div class="top"><div class="hello"><small id="date"></small><h1 id="greet">Hello</h1></div><div style="display:flex;align-items:center;gap:12px" class="me"><div class="tsw" id="tsw" role="group" aria-label="Theme"><button data-t="auto" title="Auto (sunrise to sunset)" aria-label="Auto theme"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button><button data-t="light" title="Light" aria-label="Light theme"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button data-t="dark" title="Dark" aria-label="Dark theme"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="currentColor"/></svg></button></div><div class="me" id="me"></div></div></div>
 <main class="grid">
  <a class="w lyr" href="../" id="wLyr"><div class="wbg" id="lyrBg"></div><div class="wshade"></div>
   <div class="lab"><i style="background:linear-gradient(135deg,#ff2bd6,#7a3cff)"><svg width="11" height="11" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="6" rx="3" fill="#fff" opacity=".7"/><rect x="9" y="13" width="12" height="6" rx="3" fill="#fff"/></svg></i>Lyricism<span class="eq" id="eq" hidden><s></s><s></s><s></s></span></div>
   <div class="body" id="lyrBody"></div></a>
  <a class="w mat" href="../matchday/" id="wMat"><div class="lab"><i style="background:linear-gradient(90deg,#004d98 50%,#a50044 50%);box-shadow:0 0 0 1px #edbb00"></i>Matchday</div><div class="body" id="matBody"><div class="mst">Loading Barça…</div></div></a>
  <a class="w wrp" href="../wrapped/" id="wWrp"><div class="wbg" id="wrpBg"></div><div class="wshade"></div><div class="lab"><i style="background:linear-gradient(135deg,#1ed760,#ff2bd6)"></i>Wrapped</div><div class="body" id="wrpBody"></div></a>
  <a class="w wal" href="../wall/" id="wWal"><div class="mos" id="mos"></div><div class="wshade"></div><div class="lab"><i style="background:#fff"><svg width="10" height="10" viewBox="0 0 10 10"><rect width="4" height="4" fill="#000"/><rect x="6" width="4" height="4" fill="#000"/><rect y="6" width="4" height="4" fill="#000"/><rect x="6" y="6" width="4" height="4" fill="#000"/></svg></i>Album Wall</div><div class="body"><b>Your albums</b></div></a>
  <div class="w wea" id="wWea"><div class="wfx" id="wfx"></div><div class="lab"><i style="background:linear-gradient(135deg,#5ac8fa,#007aff)"><svg width="11" height="11" viewBox="0 0 24 24"><circle cx="9" cy="9" r="5" fill="#ffd60a"/><path d="M8 19h10a4 4 0 0 0 0-8 6 6 0 0 0-11 2 3 3 0 0 0 1 6z" fill="#fff"/></svg></i>Weather<span class="wloc" id="wloc"></span></div><div id="wBody"><div class="wdesc">Loading weather…</div></div></div>
  <a class="w con" href="../concerts/" id="wCon"><div class="lab"><i style="background:linear-gradient(135deg,#ff375f,#ff9f0a)"></i>Concerts</div><div id="conBody" class="idle"><b>Who's touring?</b><small>Gigs from artists you listen to</small></div></a>
 </main>
 <p class="foot">Lyricism · Matchday · Wrapped · Album Wall · Concerts</p>
</div>
<script>
{
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=o=>(o?.images||[]).slice().sort((a,b)=>(b.width||0)-(a.width||0))[0]?.url||'';

/* ---------- Spotify (shared login with Lyricism) ---------- */
async function token(){
 if(+store.get('ll_exp')>Date.now()&&store.get('ll_token'))return store.get('ll_token');
 const rt=store.get('ll_refresh'),cid=store.get('ll_cid');if(!rt||!cid)return null;
 try{const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:rt,client_id:cid})});
  const j=await r.json();if(!r.ok)return null;store.set('ll_token',j.access_token);store.set('ll_exp',Date.now()+j.expires_in*1000-60000);if(j.refresh_token)store.set('ll_refresh',j.refresh_token);return j.access_token}catch(e){return null}
}
async function sp(path){const t=await token();if(!t)throw new Error('auth');const r=await fetch('https://api.spotify.com/v1'+path,{headers:{Authorization:'Bearer '+t}});if(r.status===204)return null;if(!r.ok)throw new Error(String(r.status));return r.json()}
const li=()=>!!store.get('ll_refresh'),top=()=>/\buser-top-read\b/.test(store.get('ll_scope')||'');

/* ---------- header ---------- */
function header(name){

 $('greet').textContent=g+(name?', '+name:'');
 $('date').textContent=new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'});
}
async function me(){

/* ---------- colours ---------- */
function tint(url){if(!url)return;const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=20;const x=c.getContext('2d');x.drawImage(im,0,0,20,20);
 const d=x.getImageData(0,0,20,20).data,px=[];for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);px.push({r,g,b,s:(mx-mn)*(mx/255)})}
 px.sort((a,b)=>b.s-a.s);const A=px[0],B=px[Math.floor(px.length*.2)];document.documentElement.style.setProperty('--a',`rgb(${A.r},${A.g},${A.b})`);document.documentElement.style.setProperty('--b',`rgb(${B.r},${B.g},${B.b})`)}catch(e){}};im.src=url}

/* ---------- Lyricism widget: now playing + current lyric ---------- */
let np=null,npAt=0,lyr={key:'',lines:[]},curIdx=-2;
const ICO={prev:'<svg viewBox="0 0 24 24"><path d="M11.5 6v12L3 12zM21 6v12l-8.5-6z" fill="currentColor"/></svg>',next:'<svg viewBox="0 0 24 24"><path d="M12.5 6v12L21 12zM3 6v12l8.5-6z" fill="currentColor"/></svg>',
 play:'<svg viewBox="0 0 24 24"><path d="M8.4 5.2v13.6L19.2 12z" fill="currentColor"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor"/></svg>'};
async function pollNP(){
 if(!li()){$('lyrBody').innerHTML=`<div class="idle" style="margin-top:auto"><b>Synced lyrics</b><small>Connect Spotify to see what's playing</small></div>`;return}
 try{const d=await sp('/me/player/currently-playing');
  if(!d||!d.item||d.item.type!=='track'){np=null;curIdx=-2;$('eq').hidden=true;$('lyrBody').innerHTML=`<div class="idle" style="margin-top:auto"><b>Nothing playing</b><small>Play something on Spotify, then tap to open Lyricism</small></div>`;$('lyrBg').style.backgroundImage='';return}
  const changed=!np||np.item.id!==d.item.id;np=d;npAt=performance.now();
  $('wLyr').classList.toggle('paused',!d.is_playing);$('eq').hidden=false;
  if(changed){const a=img(d.item.album);$('lyrBg').style.backgroundImage=a?`url('${a}')`:'';tint(a);curIdx=-2;
   $('lyrBody').innerHTML=`<div class="nphead"><div class="cv" style="${a?`background-image:url('${esc(a)}')`:''}"></div><div><b>${esc(d.item.name)}</b><small>${esc(d.item.artists.map(x=>x.name).join(', '))}</small></div></div>
    <div class="lyrs"><div class="lcur none" id="lcur">♪</div><div class="lnxt" id="lnxt"></div></div>
    <div class="ptime"><span id="tc">0:00</span><div class="pb"><i id="pb"></i></div><span id="tr">-0:00</span></div>
    <div class="npc"><button data-a="previous" aria-label="Previous">${ICO.prev}</button><button class="pp" data-a="toggle" id="lpp" aria-label="Play or pause"></button><button data-a="next" aria-label="Next">${ICO.next}</button></div>`;
   $('lyrBody').querySelectorAll('.npc button').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();ctl(b.dataset.a)});
   loadLyrics(d.item)}
  const pp=$('lpp');if(pp)pp.innerHTML=d.is_playing?ICO.pause:ICO.play;
 }catch(e){if(e.message==='auth')$('lyrBody').innerHTML=`<div class="idle" style="margin-top:auto"><b>Reconnect Spotify</b><small>Your login expired. Tap to open Lyricism</small></div>`}
}
async function ctl(a){
 if(!np)return;
 const t=await token();if(!t)return;
 let url,method='POST';
 if(a==='toggle'){method='PUT';url=np.is_playing?'pause':'play';np.progress_ms=Math.min(np.item.duration_ms,np.progress_ms+(np.is_playing?performance.now()-npAt:0));npAt=performance.now();np.is_playing=!np.is_playing;
  $('wLyr').classList.toggle('paused',!np.is_playing);$('lpp').innerHTML=np.is_playing?ICO.pause:ICO.play}
 else url=a;
 try{const r=await fetch('https://api.spotify.com/v1/me/player/'+url,{method,headers:{Authorization:'Bearer '+t}});
  if(r.status===403){const c=$('lcur');if(c){c.className='lcur none in';c.textContent='Controls need Spotify Premium'}}}catch(e){}
 setTimeout(pollNP,a==='toggle'?900:450);
}
async function loadLyrics(t){
 const key=t.id;lyr={key,lines:[]};
 try{const r=await fetch('https://lrclib.net/api/get?'+new URLSearchParams({track_name:t.name,artist_name:t.artists[0].name,album_name:t.album.name,duration:Math.round(t.duration_ms/1000)}));
  const j=r.ok?await r.json():null;if(lyr.key!==key)return;
  if(j&&j.syncedLyrics)lyr.lines=j.syncedLyrics.split('\n').map(l=>{const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);return m?{t:(+m[1]*60+ +m[2])*1000,x:m[3].trim()}:null}).filter(Boolean);
  if(!lyr.lines.length){const c=$('lcur');if(c){c.className='lcur none in';c.textContent=j&&j.instrumental?'Instrumental':'No synced lyrics for this one'}}
 }catch(e){}
}
const fmt2=ms=>{ms=Math.max(0,ms|0);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function tick(){
 if(np&&np.item){const dur=np.item.duration_ms,p=Math.min(dur,np.progress_ms+(np.is_playing?performance.now()-npAt:0));
  const b=$('pb');if(b){b.style.width=(p/dur*100)+'%';const tc=fmt2(p),tr='-'+fmt2(dur-p);if($('tc').textContent!==tc)$('tc').textContent=tc;if($('tr').textContent!==tr)$('tr').textContent=tr}
  if(lyr.lines.length&&$('lcur')){
   const t=p+(+store.get('ll_offset')||0);let i=-1;for(let k=0;k<lyr.lines.length;k++){if(lyr.lines[k].t<=t)i=k;else break}
   let ci=i;while(ci>=0&&!lyr.lines[ci].x)ci--;
   const isGap=i>=0&&!lyr.lines[i].x&&lyr.lines[i+1]&&lyr.lines[i+1].t-lyr.lines[i].t>4000;
   const key=isGap?'gap'+i:ci;
   if(key!==curIdx){curIdx=key;
    const c=$('lcur'),n=$('lnxt');let nx=(ci>=0?ci:i)+1;while(lyr.lines[nx]&&!lyr.lines[nx].x)nx++;
    if(isGap||ci<0){c.className='lcur none in';c.textContent='♪';n.className='lnxt in';n.textContent=lyr.lines[nx]?.x||''}
    else{c.className='lcur in';c.innerHTML=lyr.lines[ci].x.split(/\s+/).map(w=>`<span class="lw">${esc(w)}</span>`).join(' ');n.className='lnxt in';n.textContent=lyr.lines[nx]?.x||''}
   }
   if(typeof curIdx==='number'&&curIdx>=0){const L=lyr.lines[curIdx],nt=(lyr.lines.slice(curIdx+1).find(l=>l)||{}).t||L.t+4000;
    const lp=Math.max(0,Math.min(1,(t-L.t)/(Math.min(nt-L.t,7000)*.85))),ws=$('lcur').querySelectorAll('.lw'),lens=[...ws].map(w=>w.textContent.length+1),tot=lens.reduce((a,b)=>a+b,0)||1;
    let acc=0;ws.forEach((w,k)=>{const a=acc/tot,b=(acc+lens[k])/tot;acc+=lens[k];w.style.setProperty('--p',Math.max(0,Math.min(1,(lp-a)/(b-a))).toFixed(3))})}
  }}
 requestAnimationFrame(tick);
}

/* ---------- Matchday widget ---------- */
const ESPN='https://site.api.espn.com/apis/site/v2/sports/soccer/';
async function match(){
 try{
  const lgs=['esp.1','uefa.champions','esp.copa_del_rey'],reqs=[];
  lgs.forEach(lg=>['','?fixture=true'].forEach(q=>reqs.push(fetch(`${ESPN}${lg}/teams/83/schedule${q}`).then(r=>r.ok?r.json():{}).then(d=>(d.events||[]).map(e=>({e,lg}))).catch(()=>[]))));
  const all=(await Promise.all(reqs)).flat(),st=e=>(e.competitions?.[0]?.status||e.status)?.type?.state||'pre';
  const live=all.find(x=>st(x.e)==='in'),past=all.filter(x=>st(x.e)==='post').sort((a,b)=>new Date(b.e.date)-new Date(a.e.date))[0],next=all.filter(x=>st(x.e)==='pre'&&new Date(x.e.date)>Date.now()-3*3600e3).sort((a,b)=>new Date(a.e.date)-new Date(b.e.date))[0];
  const pick=live||(past&&Date.now()-new Date(past.e.date)<5*3600e3?past:next)||past;
  if(!pick){$('matBody').innerHTML='<div class="mst">No matches found</div>';return}
  const e=pick.e,cs=e.competitions?.[0]?.competitors||[],h=cs.find(c=>c.homeAway==='home')||cs[0]||{},a=cs.find(c=>c.homeAway==='away')||cs[1]||{},state=st(e);
  const sc=c=>{const v=c.score;return v==null?'':typeof v==='object'?(v.displayValue??v.value??''):v},lg=t=>t?.logos?.[0]?.href||t?.logo||'';
  const team=c=>`<div>${lg(c.team)?`<img src="${esc(lg(c.team))}" alt="">`:'<span class="ph"></span>'}<span>${esc(c.team?.shortDisplayName||c.team?.displayName||'')}</span></div>`;
  const d=new Date(e.date),status=e.competitions?.[0]?.status||e.status||{};
  const mid=state==='pre'?`<div class="sc"><em>vs</em></div>`:`<div class="sc">${esc(sc(h))}<em>–</em>${esc(sc(a))}</div>`;
  const line=state==='in'?`<span class="live"><s></s>LIVE ${esc(status.displayClock||'')}</span>`:state==='post'?'Full time':`${d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})} · ${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`;
  $('matBody').innerHTML=`<div class="mrow">${team(h)}${mid}${team(a)}</div><div class="mst">${line}</div>`;
  setTimeout(match,state==='in'?20000:300000);
 }catch(e){$('matBody').innerHTML='<div class="mst">Couldn\'t load Barça</div>'}
}

/* ---------- weather (Open-Meteo, no key needed) ---------- */
const PERTH={lat:-31.95,lng:115.86,name:'Perth',precise:false};
let wloc=JSON.parse(store.get('wx_loc')||'null')||PERTH;
function wkind(code,day){
 if(code===0)return day?'clear':'night';if(code<=2)return day?'partly':'nightcloud';if(code===3)return 'cloud';if(code===45||code===48)return 'fog';
 if(code>=95)return 'storm';if((code>=71&&code<=77)||code===85||code===86)return 'snow';if(code>=51)return 'rain';return 'cloud'}
const WTXT={clear:'Clear',night:'Clear',partly:'Partly cloudy',nightcloud:'Partly cloudy',cloud:'Cloudy',fog:'Foggy',rain:'Rain',storm:'Thunderstorms',snow:'Snow'};
const WGRAD={clear:['#2f7fe0','#87c7f7'],night:['#0b1633','#2b3d72'],partly:['#4a86c9','#9fc6e8'],nightcloud:['#1a2440','#3f4c6e'],cloud:['#5f7891','#a3b4c6'],fog:['#7e8a95','#bfc6cc'],rain:['#3a4f66','#6e849a'],storm:['#232842','#4c5070'],snow:['#7f98b2','#d2deea']};
function wicon(k,big){
 const sun=`<g class="${big?'sunr':''}"><circle cx="12" cy="12" r="4.6" fill="#ffd60a"/><g stroke="#ffd60a" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></g>`;
 const moon=`<path d="M17.5 14.5A7 7 0 1 1 10 5a5.6 5.6 0 0 0 7.5 9.5z" fill="#f2f2f7"/>`;
 const cloud=(x=0,y=0,c='#fff')=>`<path class="${big?'cld':''}" transform="translate(${x} ${y})" d="M7.5 19h10a4 4 0 0 0 .4-8 5.8 5.8 0 0 0-11.2 1.6A3.2 3.2 0 0 0 7.5 19z" fill="${c}"/>`;
 const g={clear:sun,night:moon,partly:`<g transform="translate(-3 -3) scale(.8)">${sun}</g>`+cloud(2,2),nightcloud:`<g transform="translate(-3 -3) scale(.8)">${moon}</g>`+cloud(2,2),cloud:cloud(-2,-3,'#e5e5ea')+cloud(1,0),
  fog:cloud(0,-3,'#e5e5ea')+'<path d="M4 20h16M6 23h12" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>',rain:cloud(0,-3)+'<path d="M8 19l-1 3M12 19l-1 3M16 19l-1 3" stroke="#64d2ff" stroke-width="1.8" stroke-linecap="round"/>',
  storm:cloud(0,-3,'#d1d1d6')+`<path class="${big?'bolt':''}" d="M12.5 16 9.5 21h3l-1.5 3.5L15 19h-3l1-3z" fill="#ffd60a"/>`,snow:cloud(0,-3)+'<g fill="#fff"><circle cx="8" cy="21" r="1.2"/><circle cx="12" cy="22.5" r="1.2"/><circle cx="16" cy="21" r="1.2"/></g>'}[k];
 return `<svg viewBox="0 0 24 26" aria-hidden="true">${g}</svg>`;
}
function wfx(k){const f=$('wfx');let h='';
 if(k==='rain'||k==='storm')for(let i=0;i<28;i++)h+=`<i style="left:${Math.random()*110}%;animation-delay:${-Math.random()}s;animation-duration:${.7+Math.random()*.4}s"></i>`;
 if(k==='snow')for(let i=0;i<22;i++)h+=`<i class="s" style="left:${Math.random()*100}%;animation-delay:${-Math.random()*4}s;animation-duration:${3+Math.random()*3}s"></i>`;
 if(k==='night'||k==='nightcloud')for(let i=0;i<18;i++)h+=`<i class="st" style="left:${Math.random()*100}%;top:${Math.random()*55}%;animation-delay:${-Math.random()*3}s"></i>`;
 f.innerHTML=reduceMotion?'':h}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
async function weather(){
 try{
  const u='https://api.open-meteo.com/v1/forecast?'+new URLSearchParams({latitude:wloc.lat,longitude:wloc.lng,current:'temperature_2m,apparent_temperature,weather_code,is_day',hourly:'temperature_2m,weather_code,is_day',daily:'temperature_2m_max,temperature_2m_min,sunrise,sunset',timezone:'auto',forecast_days:'2'});
  const d=await (await fetch(u)).json();if(!d.current)throw 0;
  const c=d.current,k=wkind(c.weather_code,c.is_day),[g1,g2]=WGRAD[k];
  const W=$('wWea');W.style.setProperty('--w1',g1);W.style.setProperty('--w2',g2);wfx(k);
  // save sunrise/sunset (minutes after midnight, local) so Auto theme can follow the real sun
  const mins=s=>{const t=s.split('T')[1]||'';return +t.slice(0,2)*60+ +t.slice(3,5)};
  if(d.daily?.sunrise?.[0]){store.set('ui_sun',JSON.stringify({rise:mins(d.daily.sunrise[0]),set:mins(d.daily.sunset[0]),at:Date.now()}));themeNow()}
  const nowISO=c.time.slice(0,13),hi=d.hourly.time.findIndex(t=>t.slice(0,13)===nowISO);
  const hrs=[1,2,3,4,5].map(n=>hi+n).filter(i=>i>0&&i<d.hourly.time.length).map(i=>{const t=d.hourly.time[i],h=+t.slice(11,13),lab=h===0?'12am':h<12?h+'am':h===12?'12pm':(h-12)+'pm';
   return `<div><span>${lab}</span>${wicon(wkind(d.hourly.weather_code[i],d.hourly.is_day[i]))}<b>${Math.round(d.hourly.temperature_2m[i])}°</b></div>`}).join('');
  $('wBody').innerHTML=`<div class="wnow"><span class="tmp">${Math.round(c.temperature_2m)}°</span>${wicon(k,true)}</div>
   <div class="wdesc">${WTXT[k]}<small>H:${Math.round(d.daily.temperature_2m_max[0])}°  L:${Math.round(d.daily.temperature_2m_min[0])}° · Feels ${Math.round(c.apparent_temperature)}°</small></div><div class="whrs">${hrs}</div>`;
  $('wloc').innerHTML=wloc.precise?`<svg width="10" height="10" viewBox="0 0 24 24"><path d="M21 3 3 10.5l7.5 3L13.5 21z" fill="#fff"/></svg>${esc(wloc.name)}`:`${esc(wloc.name)} <button class="wbtn" id="wme" title="Use my location" aria-label="Use my location"><svg width="10" height="10" viewBox="0 0 24 24"><path d="M21 3 3 10.5l7.5 3L13.5 21z" fill="#fff"/></svg></button>`;
  if($('wme'))$('wme').onclick=locate;
 }catch(e){$('wBody').innerHTML='<div class="wdesc">Couldn\'t load the weather</div>'}
}
async function placeName(lat,lng){try{const r=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?'+new URLSearchParams({latitude:lat,longitude:lng,localityLanguage:'en'}));const j=await r.json();return j.city||j.locality||j.principalSubdivision||'My location'}catch(e){return 'My location'}}
function locate(){
