<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lyricism</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Barlow+Condensed:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Nunito:wght@300..900&family=Newsreader:opsz,wght@6..72,300..800&family=Big+Shoulders+Stencil+Display:wght@300..900&family=JetBrains+Mono:wght@300..800&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:true}
:root{--a:#ff2bd6;--b:#7a3cff;--grey:#262629;--blue:#0b84ff;--win:#000}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#000;color:#fff;font:17px/1.3 -apple-system,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit}
.amb{position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(40vmax 30vmax at 25% 40%,color-mix(in srgb,var(--a) 14%,transparent),transparent 70%),
 radial-gradient(40vmax 30vmax at 80% 75%,color-mix(in srgb,var(--b) 12%,transparent),transparent 70%)}

.cap{position:fixed;top:clamp(14px,3vh,32px);right:clamp(16px,3vw,40px);text-align:right;z-index:3}
.cap .h{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;letter-spacing:.02em}
.cap .s{opacity:.6;font-size:14px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 3D scene + neon window */
.scene{position:fixed;inset:0;display:grid;place-items:center;perspective:1400px}
.rig{position:relative;width:min(520px,90vw);height:min(72vh,660px);transform-style:preserve-3d;animation:sway 14s ease-in-out infinite alternate}
@keyframes sway{0%{transform:rotateY(14deg) rotateX(6deg) translateX(-4vw)}100%{transform:rotateY(-10deg) rotateX(3deg) translateX(2vw)}}
.rig{--glow:.9;--kick:0}
.win{position:absolute;inset:0;border-radius:10px;background:var(--win);}
.win::before,.win::after{content:"";position:absolute;inset:-3px;border-radius:12px;padding:3px;pointer-events:none;
 background:conic-gradient(from var(--ang),var(--a),transparent 18%,var(--b) 32%,transparent 50%,var(--a) 66%,transparent 82%,var(--a));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.win::after{filter:blur(14px);opacity:.85;inset:-6px;padding:6px}
.paused .rig{animation-play-state:paused}

/* iMessage header */
.head{position:absolute;top:0;left:0;right:0;z-index:3;padding:12px 14px 9px;text-align:center;border-radius:10px 10px 0 0;
 background:rgba(28,28,30,.82);backdrop-filter:blur(18px);border-bottom:.5px solid rgba(255,255,255,.12)}
.ava{width:46px;height:46px;border-radius:50%;margin:0 auto 4px;background:linear-gradient(160deg,#8e8e93,#5a5a5f);background-size:cover;background-position:center}
.nm{font-size:12px;display:inline-flex;align-items:center;gap:3px;max-width:62%;white-space:nowrap}
.nm span{overflow:hidden;text-overflow:ellipsis}
.nm svg{flex:none;opacity:.5}
.ar{font-size:11px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%;margin:1px auto 0}
.pbar{position:absolute;left:0;right:0;bottom:-1px;height:2px}
.pbar i{display:block;height:100%;width:0;background:var(--blue)}
.back{position:absolute;left:12px;top:24px;color:var(--blue);display:flex;align-items:center;gap:2px;font-size:15px;max-width:30%}
.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{position:absolute;right:8px;top:16px;display:flex}
.ib{width:36px;height:36px;border:0;background:none;color:var(--blue);display:grid;place-items:center;cursor:pointer;border-radius:50%}
.ib:hover{background:rgba(255,255,255,.08)}.ib:focus-visible{outline:2px solid var(--blue)}

/* chat */
.chat{position:absolute;top:96px;bottom:10px;left:0;right:0;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;mask-image:linear-gradient(transparent,#000 22%)}
.stamp{text-align:center;font-size:11px;color:#8e8e93;padding:6px 0 10px}.stamp b{font-weight:600}
.row{display:grid;grid-template-rows:1fr;animation:grow .35s cubic-bezier(.2,.8,.2,1)}
.row>div{overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;padding:1px 16px 1px 14px}
.row.me>div{align-items:flex-end;padding:1px 14px 1px 16px}
.row.tail{margin-bottom:8px}
.instant .row,.instant .bub{animation:none}
@keyframes grow{from{grid-template-rows:0fr}}
.bub{position:relative;max-width:75%;padding:7px 13px 8px;border-radius:18px;background:var(--grey);color:#fff;font-size:clamp(15px,1.8vw,17px);line-height:1.3;
 transform-origin:bottom left;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.me .bub{background:var(--blue);transform-origin:bottom right}
@keyframes pop{from{transform:scale(.55) translateY(10px);opacity:0}}
/* classic iMessage tails */
.tail .bub:not(.card)::before,.tail .bub:not(.card)::after{content:"";position:absolute;bottom:0;height:20px}
.tail .bub:not(.card)::before{left:-7px;width:20px;background:inherit;border-bottom-right-radius:16px}
.tail .bub:not(.card)::after{left:-10px;width:10px;background:var(--win);border-bottom-right-radius:10px}
.me.tail .bub::before{left:auto;right:-7px;border-bottom-right-radius:0;border-bottom-left-radius:16px}
.me.tail .bub::after{left:auto;right:-10px;border-bottom-right-radius:0;border-bottom-left-radius:10px}
.w{display:inline-block;margin-right:.24em;--p:1;opacity:calc(.25 + .75*var(--p));filter:blur(calc((1 - var(--p))*3px))}
.w:last-child{margin-right:0}
.old .bub{opacity:.9}
.beat-on{background:var(--blue)!important;color:#fff!important;border-color:transparent!important}
.dl{font-size:11px;color:#8e8e93;margin:3px 4px 0;font-weight:500}

/* location card */
.card{padding:0;overflow:hidden;width:min(260px,75%)}
.card>svg{display:block;width:100%;height:110px}
.card .tx{padding:8px 12px 10px}
.card .loc{font-size:12px;color:#8e8e93;margin-top:2px}

/* typing */
.typing{display:flex;gap:4px;padding:12px 14px}
.typing b{width:8px;height:8px;border-radius:50%;background:#8e8e93;animation:dot 1.3s infinite}
.typing b:nth-child(2){animation-delay:.2s}.typing b:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.35}30%{opacity:1}}

.empty{position:absolute;inset:96px 24px 24px;display:grid;place-items:center;text-align:center;color:#8e8e93;font-size:15px}

.art{position:absolute;width:46%;aspect-ratio:1.35;right:-48%;bottom:-16%;border-radius:4px;background:linear-gradient(135deg,var(--a),var(--b));background-size:cover;background-position:center;
 transform:translateZ(90px) rotateY(-22deg);box-shadow:0 0 0 2px color-mix(in srgb,var(--a) 70%,transparent),0 0 40px -6px var(--a),0 30px 60px rgba(0,0,0,.7)}

/* controls */
/* Apple-style glass dock (appears when the mouse is near the bottom) */
.dock{position:fixed;left:50%;bottom:20px;z-index:6;display:flex;align-items:center;gap:6px;padding:7px;border-radius:22px;
 background:rgba(38,38,42,.55);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
 border:.5px solid rgba(255,255,255,.18);box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.2);
 transform:translate(-50%,18px) scale(.94);opacity:0;filter:blur(6px);pointer-events:none;transform-origin:50% 100%;transition:opacity .28s ease,filter .35s ease,transform .6s var(--spring);font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;width:max-content;max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
:root{--spring:linear(0,.009,.037 1.7%,.153 3.6%,.776 10.3%,1.001,1.142 16%,1.185,1.209 19%,1.215 19.9% 20.8%,1.199,1.165 25%,1.056 30.3%,1.008 33%,.973,.958 39.4%,.954 41.7%,.96,.977 47.8%,1.006 54.1%,1.015 58.2%,1.006 66.6%,.997 74.5%,1);
 --soft:linear(0,.06,.21 7%,.44 12.5%,.7 19%,.87 25.5%,.96 32%,1.01 39%,1.02 46%,1.008 60%,1)}
body.show-dock .dock{opacity:1;filter:none;transform:translate(-50%,0) scale(1);pointer-events:auto;transition:opacity .25s ease,filter .3s ease,transform .7s var(--soft)}
.dock>*{opacity:0;transform:translateY(6px) scale(.96);transition:opacity .2s ease,transform .5s var(--soft)}
body.show-dock .dock>*{opacity:1;transform:none}
body.show-dock .dock>:nth-child(1){transition-delay:.02s}body.show-dock .dock>:nth-child(2){transition-delay:.05s}
body.show-dock .dock>:nth-child(3){transition-delay:.08s}body.show-dock .dock>:nth-child(4){transition-delay:.11s}body.show-dock .dock>:nth-child(5){transition-delay:.14s}
.grp{display:flex;align-items:center;gap:2px}
.sep{width:.5px;height:26px;background:rgba(255,255,255,.18);margin:0 4px}
.db{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;transition:background .2s ease,transform .45s var(--spring)}
.db:hover{background:rgba(255,255,255,.12)}
.dock.mag .db,.dock.mag .pill{transition:background .2s ease,transform .22s cubic-bezier(.25,.8,.3,1)}
.db,.pill{transform-origin:50% 100%;will-change:transform}.db:active{transform:scale(.92)}
.db.big{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.95);color:#000}
.db.big:hover{background:#fff}
.db svg{width:20px;height:20px}.db.big svg{width:22px;height:22px}
.db:focus-visible,.pill:focus-visible,.step button:focus-visible{outline:2px solid #0a84ff;outline-offset:2px}
.db.on{color:#0a84ff;background:rgba(10,132,255,.16)}
.step{display:flex;align-items:center;height:32px;border-radius:9px;background:rgba(118,118,128,.24);margin:0 4px}
.step button{width:30px;height:32px;border:0;background:none;color:#fff;font-size:18px;cursor:pointer;border-radius:9px}
.step button:hover{background:rgba(255,255,255,.1)}
.step span{min-width:52px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.75);border-left:.5px solid rgba(255,255,255,.15);border-right:.5px solid rgba(255,255,255,.15);line-height:18px}
.pill{height:36px;padding:0 16px;border:0;border-radius:18px;background:#0a84ff;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.pill:hover{background:#2b95ff}.pill.out{background:rgba(118,118,128,.3)}
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(5px) scale(.9);transition:opacity .18s ease,transform .4s var(--soft)!important;white-space:nowrap;font-size:11px;padding:4px 8px;border-radius:7px;background:rgba(30,30,32,.95);color:#fff;opacity:0;pointer-events:none;transition:.15s}
.tip:hover::after{opacity:1;transform:translateX(-50%);transition-delay:.25s!important}
.stat{opacity:0!important}body.show-dock .stat,.stat.fresh{opacity:.6!important}
body.idle:not(.s-chat){cursor:none}
.btn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;font-size:13px}
.btn:hover{background:rgba(255,255,255,.16)}.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.main{background:#fff;color:#000;border:0;font-weight:600}
.off{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
.stat{position:fixed;right:clamp(16px,3vw,40px);bottom:clamp(14px,2vh,26px);font-size:12px;opacity:.5;transition:opacity .6s;z-index:4}

.modal{position:fixed;inset:0;z-index:9;display:none;place-items:center;background:rgba(0,0,0,.7);padding:16px}
.modal.on{display:grid}
.dlg{background:#1c1c1e;border-radius:16px;padding:22px;max-width:500px;width:100%;font-size:15px}
.dlg h2{margin:0 0 8px;font-size:22px}
.dlg ol{padding-left:20px;margin:8px 0 14px;opacity:.85}
.dlg code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
.dlg input{width:100%;min-height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#000;color:#fff;padding:0 12px;font-size:16px;margin-bottom:12px}
.dlg .r{display:flex;gap:8px}

/* ---------- style switcher ---------- */
.rig{transition:width .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1)}
.view{position:absolute;inset:0;border-radius:10px;overflow:hidden;display:none}
body:not(.s-chat) .view{display:block}
body:not(.s-chat) .head,body:not(.s-chat) .chat,body:not(.s-chat) .art{display:none}
body:not(.s-chat) .rig{width:calc(100vw - 28px);height:calc(100vh - 28px);animation:none;transform:none}
body:not(.s-chat) .cap{display:none}
body:not(.s-chat) .olyr{font-size:clamp(18px,2.8vw,44px)}
body:not(.s-chat) .empty{z-index:3;inset:0}
.stylebox{position:fixed;left:50%;transform:translateX(-50%) translateY(14px) scale(.9);transform-origin:50% 100%;opacity:0;filter:blur(8px);visibility:hidden;pointer-events:none;transition:opacity .2s ease,filter .25s ease,transform .45s var(--soft),visibility 0s .45s;bottom:84px;z-index:7;background:rgba(38,38,42,.7);backdrop-filter:blur(30px) saturate(180%);border:.5px solid rgba(255,255,255,.18);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.5);padding:10px;display:grid;grid-template-columns:repeat(3,minmax(0,160px));gap:8px}
.stylebox.open{opacity:1;filter:none;visibility:visible;pointer-events:auto;transform:translateX(-50%);transition:opacity .22s ease,filter .3s ease,transform .65s var(--spring),visibility 0s}
.stylebox>*{opacity:0;transform:translateY(8px);transition:opacity .2s,transform .5s var(--soft)}
.stylebox.open>*{opacity:1;transform:none}
.stylebox.open>:nth-child(2){transition-delay:.03s}.stylebox.open>:nth-child(3){transition-delay:.06s}.stylebox.open>:nth-child(4){transition-delay:.09s}
.stylebox.open>:nth-child(5){transition-delay:.12s}.stylebox.open>:nth-child(6){transition-delay:.15s}.stylebox.open>:nth-child(7){transition-delay:.18s}
.stylebox.open>:nth-child(8){transition-delay:.21s}.stylebox.open>:nth-child(n+9){transition-delay:.24s}
.opt{transition:background .2s,border-color .2s,box-shadow .2s,transform .45s var(--spring)}.opt:active{transform:scale(.96)}
@media(max-width:560px){.stylebox{grid-template-columns:repeat(2,minmax(0,160px))}}
.fsec{display:none}
body.s-lock .fsec{display:block}
.ft i{display:block;width:26px;height:26px;border-radius:50%;box-shadow:inset -5px -4px 8px rgba(0,0,0,.45),0 0 8px rgba(255,255,255,.08)}
.fsec{grid-column:1/-1;border-top:.5px solid rgba(255,255,255,.14);margin-top:4px;padding-top:10px}
.fhd{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px;font-size:13px}.fhd span{font-size:11px;opacity:.55}
.frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ft{flex:none;width:64px;height:64px;border-radius:14px;border:0;background:rgba(118,118,128,.24);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .15s,transform .15s}
.ft:hover{background:rgba(118,118,128,.38)}.ft:active{transform:scale(.94)}
.ft b{font-size:24px;line-height:1}.ft small{font:500 9.5px Inter,system-ui,sans-serif;opacity:.6}
.ft.on{background:#fff;color:#000}.ft.on small{opacity:.7}
.wrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.wrow input{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(118,118,128,.45);outline:none}
.wrow input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.wrow input:focus-visible::-webkit-slider-thumb{outline:2px solid #0a84ff}
.wreset{border:0;background:rgba(118,118,128,.24);color:#fff;border-radius:8px;height:26px;padding:0 10px;font-size:11px;cursor:pointer}
.wreset.on{background:#0a84ff}
.opt{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;min-height:64px;font-size:13px}
.opt b{display:block;font-size:14px;margin-bottom:2px}.opt span{opacity:.6;font-size:12px}
.opt:hover{background:rgba(255,255,255,.09)}.opt.on{border-color:#0a84ff;box-shadow:inset 0 0 0 1px #0a84ff;background:rgba(10,132,255,.14)}
.tw{position:absolute;border-radius:50%;background:#fff;animation:twk 3s ease-in-out infinite}
@keyframes twk{50%{opacity:.15}}

/* Poster */
.pbg{position:absolute;inset:-2%;background:var(--art,linear-gradient(135deg,var(--a),var(--b)));background-size:cover;background-position:var(--focus,50% 50%);transition:background-position 1s;filter:sepia(.3) saturate(.85) brightness(.62);animation:ken 30s ease-in-out infinite alternate}
@keyframes ken{to{transform:scale(1.04)}}
.vg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55));pointer-events:none}
.pst{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:0 6%}
.pw{font-family:var(--lf,Inter,system-ui,sans-serif);font-weight:var(--lw,700);line-height:1;color:#f6efe2;text-shadow:0 4px 30px rgba(0,0,0,.55);letter-spacing:-.02em;white-space:nowrap}
.pw.prev{font-size:clamp(16px,2.4vw,26px);opacity:.7;animation:pup .35s ease both}
.pw.cur{animation:phit .4s cubic-bezier(.2,1.4,.4,1) both}
.pw.next{font-size:clamp(14px,2vw,22px);opacity:.45;animation:pin .35s ease both}
.pw.hl{background:#efe4cf;color:#2a2118;padding:.04em .2em;border-radius:3px;text-shadow:none}
@keyframes phit{from{transform:translateY(40%) scale(.6);opacity:0;filter:blur(6px)}}
@keyframes pup{from{transform:translateY(70%) scale(1.5)}}
@keyframes pin{from{opacity:0;transform:translateY(40%)}}
.pdots{display:flex;gap:10px}.pdots b{width:10px;height:10px;border-radius:50%;background:#f6efe2;animation:dot 1.3s infinite}
.pdots b:nth-child(2){animation-delay:.2s}.pdots b:nth-child(3){animation-delay:.4s}

/* Stars */
.cst{position:absolute;inset:8% 10% 10% 6%;animation:cin .8s ease both}
@keyframes cin{from{opacity:0;transform:scale(.96)}}
.cst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cst line{stroke:rgba(215,205,255,.55);stroke-width:1;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .6s ease}
.cst line.on{opacity:1}
.nd{position:absolute;width:0;height:0;opacity:0;transition:opacity .5s}
.nd::before{content:"";position:absolute;width:5px;height:5px;left:-2.5px;top:-2.5px;border-radius:50%;background:#e9e4ff;box-shadow:0 0 6px #b9a8ff}
.nd span{position:absolute;left:7px;bottom:4px;white-space:nowrap;font:500 12px/1 var(--lf,Inter,system-ui,sans-serif);color:#b9b3d6;transition:font-size .35s,color .35s,text-shadow .35s}
.nd.past,.nd.cur{opacity:1;transition:none}
.nd.cur span{font-size:clamp(20px,2.6vw,30px);font-weight:var(--lw,600);color:#fff;text-shadow:0 0 18px rgba(190,160,255,.9)}
.nd svg{position:absolute;left:-11px;top:-11px;width:22px;height:22px;opacity:0;transition:opacity .3s,transform .5s}
.nd.cur svg{opacity:1;transform:rotate(45deg)}
.nd.cur::before{opacity:0}

/* Orbit */
.osky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#0b1020,#020306 70%)}
.planet{position:absolute;left:50%;top:46%;width:150%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;--atmo:rgba(110,170,255,.55);
 box-shadow:0 -2px 0 color-mix(in srgb,var(--atmo) 90%,white),0 -6px 26px var(--atmo),0 -30px 120px var(--atmo);transition:box-shadow 1.5s}
.pcv{position:absolute;left:0;top:0;width:100%;height:42%;border-radius:50% 50% 0 0/100% 100% 0 0;opacity:0;transition:opacity 1.2s}
.pcv.on{opacity:1}
.rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ssys{position:absolute;left:3.2%;top:4.6%;z-index:4}
.pname{border:0;background:rgba(255,255,255,0);color:#fff;font:600 12px Inter,system-ui,sans-serif;letter-spacing:.06em;opacity:.75;display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:12px;cursor:pointer;transition:background .25s,opacity .25s}
.pname em{font-style:normal;font-weight:500;opacity:.5;letter-spacing:0}
.ssys:hover .pname,.ssys.open .pname{opacity:1;background:rgba(255,255,255,.08)}

function parseLRC(txt){
 const out=[];
 for(const raw of txt.split(/\r?\n/)){
  const tags=[...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];if(!tags.length)continue;

   for(let k=0;k<parts.length;k++){

   }

}
let sides=[];
function computeSides(){
 // back-and-forth turns of 1-3 lines; a break in the music or a question hands the turn over
 sides=[];let side='them',count=0,len=2,flip=false;
 lines.forEach((l,i)=>{

  if(flip||count>=len){side=side==='them'?'me':'them';count=0;len=1+hash(track.name+'|t'+i)%3;flip=false}

}

}

 return `<svg viewBox="0 0 260 110" preserveAspectRatio="none"><rect width="260" height="110" fill="#2b2f36"/>
 <rect x="${r()*200}" y="${r()*70}" width="46" height="30" rx="4" fill="#2f4a3a" opacity=".8"/>
 <path d="M${wx} 110 C ${wx+40} 60, ${wx+30} 25, ${wx+120} 0 L 260 0 L 260 110Z" fill="#2c4a6e" opacity=".85"/>${roads}
 <g transform="translate(130 50)"><circle r="16" fill="rgba(11,132,255,.25)"/><circle r="8" fill="#fff"/><circle r="5.5" fill="#0b84ff"/></g></svg>`;
}
function photoFor(i){

function bubbleHTML(i,cur){return bubbleHTML1(i,cur)}

const stampHTML=()=>`<div class="stamp"><b>iMessage</b><br>Today ${timeNow()}</div>`;

/* ---------- chat rendering ---------- */
const chat=$('chat');

function showUpTo(idx){

  for(let i=from;i<=idx;i++){if(kind(i)==='typing'&&i!==idx)continue;chat.insertAdjacentHTML('beforeend',bubbleHTML(i,i===idx))}

  const last=chat.lastElementChild;

  if(idx>1&&!lines[idx-1].text&&lines[idx].t-lines[idx-1].t>8000)chat.insertAdjacentHTML('beforeend',`<div class="stamp"><b>Today</b> ${timeNow()}</div>`);
  chat.insertAdjacentHTML('beforeend',bubbleHTML(idx,true));
  if(lines[idx].text)kick=Math.max(kick,beat.an?.2:.75);

}
function showPlain(){
 chat.classList.add('instant');chat.style.cssText='justify-content:flex-start;overflow-y:auto;mask-image:none';
 chat.innerHTML=lines.filter(l=>l.text).map(l=>`<div class="row tail"><div><div class="bub">${esc(l.text)}</div></div></div>`).join('');

/* ---------- neon + beat sync ---------- */
const win=document.querySelector('.win'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let kick=0,ang=0,lastF=performance.now();
const beat={an:null,buf:null,ac:null,stream:null,avg:0,last:0,lvl:0,prev:0,fAvg:0};
const rig=document.querySelector('.rig');
async function startBeat(){
 try{
  const s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},systemAudio:'include',selfBrowserSurface:'exclude'});
  const at=s.getAudioTracks();
  if(!at.length){s.getTracks().forEach(t=>t.stop());$('status').textContent='No sound shared — tick "Share system audio" and try again';return}
  const ac=new AudioContext(),an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.35;
  ac.createMediaStreamSource(new MediaStream(at)).connect(an);
  Object.assign(beat,{an,ac,stream:s,buf:new Uint8Array(an.frequencyBinCount),avg:0});
  at[0].onended=stopBeat;
  $('beat').classList.add('on');$('status').textContent='Neon synced to your music';
 }catch(e){$('status').textContent='Beat sync cancelled'}
}
function stopBeat(){
 if(beat.stream)beat.stream.getTracks().forEach(t=>t.stop());
 if(beat.ac)beat.ac.close().catch(()=>{});
 Object.assign(beat,{an:null,ac:null,stream:null});
 $('beat').classList.remove('on');
}
$('beat').onclick=()=>beat.an?stopBeat():startBeat();
function neon(t){
 const dt=Math.min(100,t-lastF);lastF=t;
 let lvl=0;
 if(beat.an){
  beat.an.getByteFrequencyData(beat.buf);
  const hz=beat.ac.sampleRate/beat.an.fftSize,top=Math.max(2,Math.round(160/hz));
  let sum=0;for(let k=1;k<=top;k++)sum+=beat.buf[k];
  lvl=sum/top/255;beat.lvl=beat.lvl*.7+lvl*.3;
  const flux=Math.max(0,lvl-beat.prev);beat.prev=lvl;
  beat.fAvg=beat.fAvg*.92+flux*.08;beat.avg=beat.avg*.97+lvl*.03;
  if(t-beat.last>190&&((flux>beat.fAvg*2.4&&flux>.035)||(lvl>beat.avg*1.15&&lvl>.2&&flux>0))){
   kick=1;beat.last=t;
  }
 }
 kick*=Math.exp(-dt/220);
 const moving=base.playing&&!reduce;
 const speed=moving?(beat.an?50+kick*140:55+kick*60):0;
 ang=(ang+speed*dt/1000)%360;
 win.style.setProperty('--ang',ang+'deg');
 rig.style.setProperty('--kick',reduce?0:kick.toFixed(3));
 rig.style.setProperty('--glow',(beat.an?.35+beat.lvl*.6+kick*.9:.75+kick*.5).toFixed(3));
}


/* ---------- lyric styles ---------- */
let style=store.get('ll_style')||'player';
const view=$('view');
let words=[],groups=[],wordGroup=[];
function buildWords(){
 words=[];groups=[];wordGroup=[];
 lines.forEach((l,i)=>{if(!l.text)return;
  const ws=l.text.split(/\s+/),start=l.t,end=lines[i+1]?lines[i+1].t:start+4000,dur=Math.min(end-start,7000)*.85;
  const lens=ws.map(w=>w.length+1),tot=lens.reduce((a,b)=>a+b,0);let acc=0;
  ws.forEach((w,j)=>{words.push({text:w,t:l.wt?l.wt[j]:start+dur*acc/tot,li:i});acc+=lens[j]});
 });
 let g=null,lc=0,prevLi=-1;
 words.forEach((w,k)=>{
  const brk=!g||(w.li!==prevLi&&(lc>=3||g.e-g.s>=15||lines.slice(prevLi+1,w.li).some(l=>!l.text)));
  if(brk){g={s:k,e:k};groups.push(g);lc=0}
  if(w.li!==prevLi)lc++;
  g.e=k;wordGroup[k]=groups.length-1;prevLi=w.li;
 });
}
function wordAt(t){let k=-1;for(let i=0;i<words.length;i++){if(words[i].t<=t)k=i;else break}return k}
function lineP(t,idx){
 const l=lines[idx],start=l.t,end=lines[idx+1]?lines[idx+1].t:start+4000;
 if(l.wt)return l.wt.map((s,k)=>{const e=l.wt[k+1]??Math.min(end,s+900);return Math.max(0,Math.min(1,(t-s)/Math.max(80,e-s)))});

 const ws=l.text.split(/\s+/),lens=ws.map(w=>w.length+1),tot=lens.reduce((a,b)=>a+b,0);let acc=0;
 return ws.map((w,k)=>{const a=acc/tot,b=(acc+lens[k])/tot;acc+=lens[k];return Math.max(0,Math.min(1,(lp-a)/(b-a)))});
}
function twinkles(n,seed){const r=rng(seed);let h='';for(let i=0;i<n;i++){const z=.6+r()*1.8;h+=`<i class="tw" style="left:${r()*100}%;top:${r()*100}%;width:${z}px;height:${z}px;opacity:${.25+r()*.6};animation-delay:${-r()*3}s;animation-duration:${2+r()*3}s"></i>`}return h}
const STAR='<svg viewBox="-12 -12 24 24"><path d="M0-11C1 -2 2-1 11 0C2 1 1 2 0 11C-1 2-2 1-11 0C-2-1-1-2 0-11Z" fill="#fff"/><circle r="3" fill="#fff" opacity=".9"/></svg>';


/* ---------- procedural planets ---------- */
let albumRGB=[255,43,214];
const PLANETS={
 mercury:{name:'Mercury',atmo:'rgba(210,205,200,.35)'},
 venus:{name:'Venus',atmo:'rgba(255,220,150,.55)'},
 earth:{name:'Earth',atmo:'rgba(100,170,255,.6)'},
 mars:{name:'Mars',atmo:'rgba(255,130,80,.5)'},
 jupiter:{name:'Jupiter',atmo:'rgba(255,200,150,.5)'},
 saturn:{name:'Saturn',atmo:'rgba(255,225,150,.5)'},
 uranus:{name:'Uranus',atmo:'rgba(150,245,255,.55)'},
 neptune:{name:'Neptune',atmo:'rgba(100,130,255,.6)'}
};
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
 if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function pickPlanet([r,g,b]){
 const[h,s,l]=rgb2hsl(r,g,b);
 if(s<.15||l<.08)return 'mercury';
 if(h<18||h>=300)return 'mars';
 if(h<42)return s<.45&&l>.55?'venus':'jupiter';
 if(h<68)return s<.4||l>.7?'venus':'saturn';

 if(h<200)return 'uranus';

}
// 3D value noise (seamless on the sphere)
const PERM=new Uint8Array(512);{const r=rng(1337),a=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}for(let i=0;i<512;i++)PERM[i]=a[i&255]}
const fade=t=>t*t*(3-2*t);
function vnoise(x,y,z){
 const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z),fx=fade(x-X),fy=fade(y-Y),fz=fade(z-Z);
 const h=(i,j,k)=>PERM[(PERM[(PERM[(X+i)&255]+Y+j)&255]+Z+k)&255]/255;
 const L=(a,b,t)=>a+(b-a)*t;
 return L(L(L(h(0,0,0),h(1,0,0),fx),L(h(0,1,0),h(1,1,0),fx),fy),L(L(h(0,0,1),h(1,0,1),fx),L(h(0,1,1),h(1,1,1),fx),fy),fz);

function findTex(list,name){for(const res of ['2k_','4k_']){const f=list.find(x=>x.n.includes(res+name));if(f)return f.u}return null}
async function bigTex(list,name){

 for(const res of ['8k_','4k_']){
  const f=list.find(x=>x.n.includes(res+name));if(!f)continue;
  try{const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&iiprop=url|size&iiurlwidth='+want+'&format=json&origin=*&titles='+encodeURIComponent(f.t));
   const j=await r.json(),pg=Object.values(j.query.pages)[0],ii=pg.imageinfo&&pg.imageinfo[0];
   if(ii)return ii.width<=want?ii.url:(ii.thumburl||ii.url)}catch(e){}

async function loadBest(list,name){

async function loadPlanetTex(key){

  const list=await ssFiles();let im=null;
  for(const w of WANT[key]){try{im=await loadBest(list,w)}catch(e){im=null}if(im)break}
  if(im){
   if(key==='earth'){
    {try{const cl=await loadBest(list,'earth_clouds'),c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');

function proceduralTex(key){

  for(let px=0;px<W;px++){const lon=((px+.5)/W-.5)*Math.PI*2;
   const cc=f(cl*Math.sin(lon)*1.6,sy*1.6,cl*Math.cos(lon)*1.6,lat,lon),o=(py*W+px)*4;
   d[o]=cc[0];d[o+1]=cc[1];d[o+2]=cc[2];d[o+3]=255}}

 $('title').textContent=name;$('artist').textContent=artist;$('capS').textContent=artist+' · '+name;
 for(const el of [$('thumb'),$('art')])el.style.backgroundImage=art?`url("${art}")`:'';
 if(art)document.documentElement.style.setProperty('--art',`url("${art}")`);else document.documentElement.style.removeProperty('--art');
 const la=$('lart');if(la)la.innerHTML=`${esc(artist)}<small>${esc(name)}</small>`;
 const np=document.querySelector('.npc div');if(np)np.innerHTML=`<b>NOW PLAYING</b>${esc(name)}<br><span style="opacity:.55">${esc(artist)}</span>`;
 if(art)setColours(art);
 const hi=hiRes(art);
 if(hi){const im=new Image();im.onload=()=>{if($('title').textContent===name&&im.naturalWidth>640)setArt(hi)};im.src=hi}
}

/* ---------- lyrics (LRCLIB) ---------- */
async function loadLyrics(name,artist,album,durMs){
 lines=[];plain=false;chat.style.cssText='';resetChat();$('empty').hidden=false;$('empty').textContent='Finding lyrics…';
 let hit=null;
 try{const r=await fetch('https://lrclib.net/api/get?'+new URLSearchParams({track_name:name,artist_name:artist,album_name:album,duration:Math.round(durMs/1000)}));if(r.ok)hit=await r.json()}catch(e){}
 if(!hit||(!hit.syncedLyrics&&!hit.plainLyrics)){
  try{const r=await fetch('https://lrclib.net/api/search?'+new URLSearchParams({track_name:name,artist_name:artist}));
   if(r.ok){const arr=await r.json();hit=arr.find(x=>x.syncedLyrics)||arr.find(x=>x.plainLyrics)||null}}catch(e){}
 }
 if(track.name!==name)return;
 if(hit&&hit.syncedLyrics){lines=parseLRC(hit.syncedLyrics);if(lines[0]&&lines[0].t>2500)lines.unshift({t:0,text:''});resetChat()}
 else if(hit&&hit.plainLyrics){plain=true;lines=hit.plainLyrics.split('\n').map(text=>({t:0,text}));showPlain()}
 else{$('empty').hidden=false;$('empty').textContent=hit&&hit.instrumental?'Instrumental — no texts this time':'No lyrics found for this one'}
}

/* ---------- Spotify auth (PKCE) ---------- */
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(cid){
 const v=b64u(crypto.getRandomValues(new Uint8Array(48)));
 const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
 store.set('ll_verifier',v);store.set('ll_cid',cid);
 location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({response_type:'code',client_id:cid,scope:SCOPES,code_challenge_method:'S256',code_challenge:ch,redirect_uri:REDIRECT});
}
async function tokenReq(body){
 const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
 const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error||'token error');
 store.set('ll_token',j.access_token);store.set('ll_exp',Date.now()+j.expires_in*1000-60000);
 if(j.refresh_token)store.set('ll_refresh',j.refresh_token);return j.access_token;
}
async function token(){
 if(+store.get('ll_exp')>Date.now())return store.get('ll_token');
 const rt=store.get('ll_refresh');if(!rt)return null;
 try{return await tokenReq({grant_type:'refresh_token',refresh_token:rt,client_id:store.get('ll_cid')})}catch(e){return null}
}
async function api(path,opts={}){const t=await token();if(!t)throw new Error('auth');return fetch('https://api.spotify.com/v1'+path,{...opts,headers:{Authorization:'Bearer '+t,...(opts.body?{'Content-Type':'application/json'}:{})}})}

const ctxCache={};let ctxUri=null;
async function setContext(ctx,it){
 const el=$('ctxName');const uri=ctx&&ctx.uri||'none';if(uri===ctxUri)return;ctxUri=uri;
 const show=n=>{if(ctxUri===uri)el.textContent=n};
 if(!ctx){show('Songs');return}
 if(ctxCache[uri]){show(ctxCache[uri]);return}
 let name=null;
 if(ctx.type==='album')name=it.album.name;
 else if(ctx.type==='artist')name=it.artists[0].name;
 else if(ctx.type==='collection'||/:collection$/.test(uri))name='Liked Songs';
 else if(ctx.type==='playlist'){
  show('Playlist');
  try{const id=uri.split(':').pop(),r=await api('/playlists/'+id+'?fields=name');if(r.ok)name=(await r.json()).name}catch(e){}
  name=name||'Playlist';
 }
 name=name||'Songs';ctxCache[uri]=name;show(name);
}
const tkey=it=>it.name+'|'+(it.artists[0]&&it.artists[0].name);
function onTrack(it){
 if(tkey(it)===track.key)return;
 track={id:it.id,key:tkey(it),dur:it.duration_ms,name:it.name};
 const imgs=it.album.images||[],big=imgs.slice().sort((a,b)=>(b.width||0)-(a.width||0))[0];
 setMeta(it.name,it.artists.map(a=>a.name).join(', '),big&&big.url);
 loadLyrics(it.name,it.artists[0].name,it.album.name,it.duration_ms);
}

/* ---------- Play in Lyricism (Spotify Web Playback SDK, Premium only) ---------- */
let sdk=null,sdkDevice=null,sdkActive=false;
function sdkLoad(){return new Promise((ok,no)=>{
 if(window.Spotify)return ok();
 window.onSpotifyWebPlaybackSDKReady=ok;
 const sc=document.createElement('script');sc.src='https://sdk.scdn.co/spotify-player.js';sc.onerror=()=>no(new Error('load'));document.head.appendChild(sc);
})}
async function playHere(){
 if(mode!=='spotify'){$('status').textContent='Connect Spotify first';return}
 if(sdk){sdk.disconnect();sdk=null;sdkDevice=null;sdkActive=false;$('here').classList.remove('on');$('status').textContent='Stopped playing in Lyricism';return}
 if(store.get('ll_scope')!==SCOPES){store.set('ll_wantPlayer','1');$('status').textContent='One-time re-login to allow playing here…';setTimeout(()=>login(store.get('ll_cid')||BUILTIN_CID),900);return}
 $('status').textContent='Starting the Lyricism player…';
 try{await sdkLoad()}catch(e){$('status').textContent='Could not load Spotify\'s player — check your connection';return}
 const p=new Spotify.Player({name:'Lyricism',getOAuthToken:cb=>token().then(t=>cb(t)),volume:.8});
 p.addListener('initialization_error',()=>{$('status').textContent='This browser can\'t play Spotify here — in Brave, allow "Google Widevine" in settings, then try again'});
 p.addListener('authentication_error',()=>{store.del('ll_scope');$('status').textContent='Spotify needs you to log in again — tap the speaker button'});
 p.addListener('account_error',()=>{$('status').textContent='Playing in Lyricism needs Spotify Premium — use Spotify itself instead';p.disconnect();sdk=null;$('here').classList.remove('on')});
 p.addListener('playback_error',e=>{$('status').textContent='Playback error: '+(e.message||'unknown')});
 p.addListener('ready',async({device_id})=>{
  sdkDevice=device_id;$('here').classList.add('on');
  try{const r=await api('/me/player',{method:'PUT',body:JSON.stringify({device_ids:[device_id],play:true})});
   $('status').textContent=r.ok||r.status===204?'Playing in Lyricism — pick songs in Spotify on any device':'Ready — choose "Lyricism" as the device in Spotify'}catch(e){}
 });
 p.addListener('not_ready',()=>{sdkActive=false});
 p.addListener('player_state_changed',st=>{
  if(!st){sdkActive=false;return}
  sdkActive=true;
  base={prog:st.position,at:performance.now(),playing:!st.paused};lockUntil=performance.now()+1500;
  document.body.classList.toggle('paused',st.paused);setIcon(!st.paused);
  const ct=st.track_window&&st.track_window.current_track;
  if(ct)onTrack({id:ct.id,name:ct.name,duration_ms:st.duration||ct.duration_ms,artists:ct.artists,album:ct.album});
 });
 p.activateElement&&p.activateElement();
 const ok=await p.connect();sdk=p;
 if(!ok){$('status').textContent='Couldn\'t start the player';sdk=null}
}
$('here').onclick=playHere;

let pollTimer=null,polling=false;
async function poll(){
 if(mode!=='spotify'||polling)return;
 polling=true;
 try{
  const t0=performance.now();
  const r=await api('/me/player/currently-playing');
  const half=(performance.now()-t0)/2;
  if(r.status===204||!r.ok){$('status').textContent=r.status===204?'Nothing playing on Spotify':'Spotify error '+r.status;if(base.playing)setPlaying(false)}
  else{
   const j=await r.json(),it=j.item;
   if(it&&it.type==='track'&&performance.now()>lockUntil){
    const np=j.progress_ms+(j.is_playing?half:0),pred=now(),diff=np-pred;
    if(j.is_playing&&base.playing&&tkey(it)===track.key&&Math.abs(diff)<350)base={prog:pred+Math.max(0,diff)*.5,at:performance.now(),playing:true};
    else base={prog:np,at:performance.now(),playing:j.is_playing};
    document.body.classList.toggle('paused',!j.is_playing);setIcon(j.is_playing);
    $('status').textContent=j.is_playing?'Live from Spotify':'Paused';
    setContext(j.context,it);
    onTrack(it);
   }
  }
 }catch(e){if(e.message==='auth'){$('status').textContent='Logged out — connect again';mode=null;$('connect').textContent='Connect Spotify';$('connect').classList.remove('out');polling=false;return}}
 polling=false;
 clearTimeout(pollTimer);pollTimer=setTimeout(poll,document.hidden?4000:1000);
}
const pollSoon=ms=>{clearTimeout(pollTimer);pollTimer=setTimeout(poll,ms)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mode==='spotify')pollSoon(0)});
function startSpotify(){mode='spotify';$('connect').textContent='Log out';$('connect').classList.add('out');track={id:null,dur:0,name:''};pollSoon(0)}

async function control(action){
 if(mode==='demo'){
  if(action==='toggle')setPlaying(!base.playing);
  else{base={prog:action==='next'?track.dur-1:0,at:performance.now(),playing:true};resetChat();setPlaying(true)}
  return;
 }
 if(mode!=='spotify')return;
 if(sdk&&sdkActive){
  if(action==='toggle'){setPlaying(!base.playing);sdk.togglePlay()}else if(action==='next')sdk.nextTrack();else sdk.previousTrack();
  return;
 }
 const playing=base.playing;
 let req;
 if(action==='toggle'){setPlaying(!playing);lockUntil=performance.now()+1500;req=api('/me/player/'+(playing?'pause':'play'),{method:'PUT'})}
 else req=api('/me/player/'+action,{method:'POST'});
 try{const r=await req;if(r.status===403)$('status').textContent='Controls need Spotify Premium';else if(r.status===404)$('status').textContent='No active Spotify device'}catch(e){}
 pollSoon(action==='toggle'?1600:350);
}
$('play').onclick=$('dPlay').onclick=()=>control('toggle');$('dNext').onclick=()=>control('next');$('dPrev').onclick=()=>control('previous');$('next').onclick=()=>control('next');$('prev').onclick=()=>control('previous');

let idleT,dockT;const B=document.body;

{const dk=$('dock'),items=()=>dk.querySelectorAll('.db,.pill');

  items().forEach(b=>{const r=b.getBoundingClientRect(),d=Math.abs(e.clientX-(r.left+r.width/2)),k=Math.max(0,1-d/85),f=k*k*(3-2*k);
   const sc=b.classList.contains('pill')?1+.04*f:1+.16*f;b.style.transform=`translateY(${(-2*f).toFixed(2)}px) scale(${sc.toFixed(3)})`})});

{const st=$('status');new MutationObserver(()=>{st.classList.add('fresh');clearTimeout(st._t);st._t=setTimeout(()=>st.classList.remove('fresh'),4000)}).observe(st,{childList:true,characterData:true,subtree:true})}
